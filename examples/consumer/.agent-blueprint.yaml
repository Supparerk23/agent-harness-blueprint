# Example generated install state for a consuming project.
# In a real repo this file is written by `blueprint install` / `init`.
# `version` is taken from the package ./VERSION file (single source of truth).
# When source is a git URL, install/sync fetch a local cache then copy.
schema_version: 1
source: https://github.com/example/agent-harness-blueprint
version: from_VERSION
blueprint: engineering
overlay: gitlab
runtimes:
  - cursor
  - claude
installed_at_utc: 2026-07-29T00:00:00Z
conflict_policy: preserve-local
harness:
  entrypoint: HARNESS.md
  managed: true
  version: "from_VERSION"
agents:
  entrypoint: AGENTS.md
  reference_managed_on_init_only: true
compatibility:
  preserve_existing_agents: true
  preserve_existing_claude: true
